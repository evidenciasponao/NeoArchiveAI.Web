<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <h1>NeoArchiveAI</h1>
      <p>Intelligent Document Management</p>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          Signing in...
        } @else {
          Sign in
        }
      </button>

    </form>

  </div>
</div>
